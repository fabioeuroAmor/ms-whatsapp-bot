spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

bot:
  evolution:
    base-url: ${EVOLUTION_API_URL}
    api-key: ${EVOLUTION_API_KEY}
    webhook-secret: ${EVOLUTION_WEBHOOK_SECRET}
  sgsm-ia:
    base-url: ${SGSM_IA_URL}
  sgsm:
    base-url: ${SGSM_URL}
  auth:
    base-url: ${AUTH_URL}
  sistema:
    jwt: ${BOT_SISTEMA_JWT:}
    email: ${BOT_SISTEMA_EMAIL}
    senha: ${BOT_SISTEMA_SENHA}

logging:
  level:
    root: WARN
    br.com.sgsm.whatsapp: INFO
