spring:
  application:
    name: ms-whatsapp-bot
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8083}

# Observabilidade: log estruturado (JSON, formato ECS) + tracing distribuido. O traceId/spanId
# entra automaticamente no MDC (e portanto no log estruturado) e se propaga sozinho entre os
# 4 servicos via header HTTP "traceparent" - nao precisa de codigo manual de correlacao.
# Maior valor aqui: este servico orquestra chamadas para os outros 3 a cada mensagem de
# WhatsApp, entao uma jornada completa passa a aparecer como uma unica trace no Zipkin.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  structured:
    format:
      console: ecs

notificacao:
  agenda-diaria:
    cron: ${NOTIFICACAO_AGENDA_DIARIA_CRON:0 0 7 * * *}

bot:
  evolution:
    instance: ${EVOLUTION_INSTANCE:sgsm-bot}
  sessao:
    ttl-minutos: 30
    historico-max: 10
  consentimento:
    mensagem: |
      Olá! Bem-vindo ao *SGSM*

      Ao continuar, você concorda com nossa política de privacidade e com o tratamento dos seus dados conforme a *LGPD*.

      Digite *ACEITO* para continuar.
  consentimento-cadastro:
    mensagem: |
      Antes de continuar seu cadastro, preciso do seu consentimento explícito.

      Seus *dados de saúde* (nome, CPF, data de nascimento, e-mail) serão tratados conforme a *LGPD*, para fins de agendamento e atendimento médico.

      Digite *ACEITO* para confirmar e continuar o cadastro.
