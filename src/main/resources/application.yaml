spring:
  application:
    name: ms-whatsapp-bot
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8083}

bot:
  evolution:
    instance: ${EVOLUTION_INSTANCE:sgsm-bot}
  sessao:
    ttl-minutos: 30
    historico-max: 10
  consentimento:
    mensagem: |
      Olá! Bem-vindo ao *SGSM*

      Ao continuar, você concorda com nossa política de privacidade e com o tratamento dos seus dados conforme a *LGPD*.

      Digite *ACEITO* para continuar.
  consentimento-cadastro:
    mensagem: |
      Antes de continuar seu cadastro, preciso do seu consentimento explícito.

      Seus *dados de saúde* (nome, CPF, data de nascimento, e-mail) serão tratados conforme a *LGPD*, para fins de agendamento e atendimento médico.

      Digite *ACEITO* para confirmar e continuar o cadastro.
